main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:26px 18px 56px;display:grid;gap:34px}
h2{font:400 46px/1 var(--gf);letter-spacing:1px;margin:0 0 24px;display:inline-block;position:relative;transform:rotate(-2deg);color:var(--c,var(--yel));text-shadow:-3px -2px 0 var(--cyn),4px 3px 0 var(--hot),6px 6px 0 #000}h2::after{content:"";position:absolute;left:12px;bottom:-16px;width:8px;height:20px;border-radius:0 0 8px 8px;background:var(--c,var(--yel));box-shadow:46px -5px 0 0 var(--c,var(--yel)),92px 2px 0 0 var(--c,var(--yel))}
.card{background:var(--card);border:3px solid #fff;border-radius:16px;padding:16px;box-shadow:7px 7px 0 var(--sh,var(--hot))}.card:nth-child(even){--sh:var(--cyn)}.card:nth-child(3n){--sh:var(--yel)}
img{display:block;width:100%;height:auto}
.hero img{border-radius:10px;transform:rotate(-1.5deg);border:4px solid #fff;box-shadow:10px 10px 0 var(--hot),-8px -8px 0 var(--cyn)}
.tag{font:400 26px/1.2 var(--gf);text-align:center;margin:28px 0 18px;color:#fff;transform:rotate(-1.5deg);text-shadow:-2px -2px 0 var(--cyn),3px 3px 0 var(--hot)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:8px;font:400 18px var(--gf);color:#fff;text-decoration:none;border:3px solid #000;background:var(--hot);box-shadow:5px 5px 0 var(--cyn);cursor:pointer}
.btn.o{background:var(--yel);color:#000;box-shadow:5px 5px 0 var(--hot)}
.btn:active{transform:scale(.96)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two img{border-radius:16px;aspect-ratio:3/4;object-fit:cover;object-position:top}
.grid{display:grid;gap:12px}
.th{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.th img{border-radius:14px;aspect-ratio:1;object-fit:cover}
.th .ph{border-radius:14px;aspect-ratio:1;background:linear-gradient(135deg,var(--org),var(--hot));display:grid;place-items:center;font:400 40px var(--gf)}
.th b,.ln b{font:400 25px var(--gf);letter-spacing:.5px}.th p,.ln p{margin:2px 0 0;color:var(--mute);font-size:15px}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ln{border-top:6px solid var(--c)}
code{display:block;margin-top:10px;padding:10px;border-radius:10px;background:#000;color:var(--lime);font:13px/1.4 ui-monospace,Menlo,monospace;overflow-x:auto}
.keys{height:46px;margin-top:10px;border-radius:8px;background:repeating-linear-gradient(90deg,#f6f1f7 0 19px,#222 19px 21px)}
.mu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mu div{border-radius:20px;padding:22px 14px 16px;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;color:#120d14;font:400 27px/1.05 var(--gf);border:3px solid #000;box-shadow:5px 5px 0 #fff;transform:rotate(-1.5deg)}.mu div:nth-child(even){transform:rotate(1.5deg)}
.mu small{font:400 14px var(--gf);letter-spacing:1px;opacity:.7}
.gal{columns:2;column-gap:10px}
.gal figure{margin:0 0 10px;break-inside:avoid;position:relative;cursor:zoom-in}
.adv{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 6px 18px;margin:0 -6px}.adv figure{margin:0;flex:0 0 74%;scroll-snap-align:center}.adv img{border-radius:6px;border:3px solid #fff;box-shadow:6px 6px 0 var(--org);aspect-ratio:4/5;object-fit:cover}.adv figure:nth-child(even) img{box-shadow:6px 6px 0 var(--cyn)}main>section{min-width:0}.gal img{border-radius:6px;border:3px solid #fff;box-shadow:5px 5px 0 var(--hot)}.gal figure:nth-child(3n+2) img{box-shadow:5px 5px 0 var(--cyn)}.gal figure:nth-child(3n) img{box-shadow:5px 5px 0 var(--yel)}

.pl{display:flex;flex-wrap:wrap;gap:14px;padding:4px}.pl div{padding:12px 16px;border-radius:10px;border:3px solid #000;box-shadow:5px 5px 0 #fff;color:#120d14;font:400 23px/1.1 var(--gf);transform:rotate(-2deg)}.pl div:nth-child(even){transform:rotate(2deg)}.pl small{display:block;margin-top:5px;font:400 12px var(--gf);letter-spacing:1px;opacity:.7}
footer{text-align:center;color:var(--mute);font-size:13px;line-height:1.55;padding:0 6px}
#lb{position:fixed;inset:0;z-index:9;background:#000e;display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));cursor:zoom-out}
#lb.on{display:flex}#lb img{max-height:100%;max-width:100%;width:auto;border-radius:12px}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}
</style>

const $=(s,e=document)=>e.querySelector(s);
const pic=(k,a)=>`<img src="${IMG[k]}" alt="${a||''}" loading="lazy">`;
const C=CONFIG;
$('#app').innerHTML=`
<section class="hero rv"><h1 class="sr">${C.name}</h1>${pic('pink',C.name)}
 <p class="tag">${C.tagline}</p>
 <div class="row"><a class="btn" href="${C.instagram.url}" target="_blank" rel="noopener">Instagram · ${C.instagram.handle}</a>
 <button class="btn o" id="dc" type="button">Discord · ${C.discord}</button></div></section>
<section class="rv"><h2 style="--c:var(--hot)">about me</h2><div class="card"><p style="margin:0">${C.about}</p>
 <div class="two">${pic('shades','Mcqueen in sunglasses and a vest')}${pic('hoodie','Mcqueen in a hoodie')}</div></div></section>
<section class="rv"><h2 style="--c:var(--org)">things I do</h2><div class="grid">${C.things.map(t=>`<div class="card th">${t.img?pic(t.img,t.title):`<div class="ph">${t.emoji}</div>`}<div><b>${t.title}</b><p>${t.text}</p></div></div>`).join('')}</div></section>
<section class="rv"><h2 style="--c:var(--blue)">adventures</h2><p style="margin:0 0 16px">${C.advText}</p><div class="adv">${C.adv.map(k=>`<figure>${pic(k,'Adventure photo')}</figure>`).join('')}</div></section>
<section class="rv"><h2 style="--c:var(--cyn)">now learning</h2><div class="lg">${C.learning.map(l=>`<div class="card ln" style="--c:${l.color}"><b>${l.title}</b><p>${l.tag}</p>${l.kind=='code'?'<code>print("hello, world")</code>':'<div class="keys"></div>'}</div>`).join('')}</div></section>
<section class="rv"><h2 style="--c:var(--lime)">on repeat</h2><div class="mu">${C.music.map(m=>`<div style="background:${m[1]}"><small>on repeat</small>${m[0]}</div>`).join('')}</div></section>
<section class="rv"><h2 style="--c:var(--yel)">through my lens</h2><div class="gal">${C.gallery.map(g=>`<figure>${pic(g[0],g[1])}</figure>`).join('')}</div></section>
<section class="rv"><h2 style="--c:var(--pur)">places I’ve been</h2><div class="pl">${C.places.map(p=>`<div style="background:${p[2]}">${p[0]}${p[1]?`<small>${p[1]}</small>`:''}</div>`).join('')}</div></section>
<section class="rv"><div class="row"><a class="btn" href="${C.instagram.url}" target="_blank" rel="noopener">Find me on Instagram</a></div></section>
<footer>${C.copyright}<br>updated ${C.updated}</footer>`;
/* discord copy */
$('#dc').onclick=async e=>{const b=e.currentTarget,o=b.textContent;try{await navigator.clipboard.writeText(C.discord);b.textContent='Copied ✓'}catch(x){b.textContent='Add me: '+C.discord}setTimeout(()=>b.textContent=o,2200)};
/* lightbox */
const lb=$('#lb');document.addEventListener('click',e=>{const f=e.target.closest('.gal img,.adv img');if(f){$('img',lb).src=f.src;lb.classList.add('on')}else if(lb.classList.contains('on'))lb.classList.remove('on')});
/* reveal */
const rv=[...document.querySelectorAll('.rv')];
if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});rv.forEach(r=>io.observe(r))}else rv.forEach(r=>r.classList.add('in'));
</script>
</body>
</html>
